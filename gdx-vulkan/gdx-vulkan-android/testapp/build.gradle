// On-device Phase 1a check: a SurfaceView that runs the pixel self-test, then spins the triangle.
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.slebed.gdxvulkan.testapp'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.slebed.gdxvulkan.testapp'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations { natives }

dependencies {
    implementation project(':library')
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-arm64-v8a" // libgdx.so: Pixmap's gdx2d, for the device suite
}

def nativesDir = layout.buildDirectory.dir('generated/jniLibs')
def copyNatives = tasks.register('copyGdxNatives', Copy) {
    from({ configurations.natives.collect { zipTree(it) } }) { include '*.so' }
    into nativesDir.map { it.dir('arm64-v8a') }
}
android.sourceSets.main.jniLibs.srcDir nativesDir
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn copyNatives }

// Gate 3 on the device: the scenes' source (shared with the desktop tests), the skin and fonts they load, and the lavapipe goldens they are
// compared with, all packaged into the app. Gdx.files is libGDX's own DefaultAndroidFiles over these assets.
dependencies {
    implementation "com.badlogicgames.gdx:gdx-backend-android:${gdxVersion}"
}

def sharedJava = layout.buildDirectory.dir('generated/shared-java')
def copySharedScenes = tasks.register('copySharedScenes', Copy) {
    from('../../gdx-vulkan-desktop/src/test/java/io/github/slebed/gdxvulkan/desktop') {
        include 'Gate3Scenes.java', 'ShapeApi.java'
        into 'io/github/slebed/gdxvulkan/desktop'
    }
    into sharedJava
}
def deviceAssets = layout.buildDirectory.dir('generated/assets')
def copyDeviceAssets = tasks.register('copyDeviceAssets', Copy) {
    from('../../../tests/gdx-tests-android/assets') { include 'data/uiskin.*', 'data/default.*' }
    from('../../gdx-vulkan-desktop/src/test/resources/goldens') {
        include 'gate3_*.png'
        into 'goldens'
    }
    into deviceAssets
}
android.sourceSets.main.java.srcDir sharedJava
android.sourceSets.main.assets.srcDir deviceAssets
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn copySharedScenes, copyDeviceAssets }
