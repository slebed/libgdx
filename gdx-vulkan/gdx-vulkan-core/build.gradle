// Core library: depends on stock libGDX only (no LWJGL, no backend).
dependencies {
    api "com.badlogicgames.gdx:gdx:${gdxVersion}"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def jniDir      = file('jni')
def nativeBuild = layout.buildDirectory.dir((((findProperty('gdxvulkan.noCompiler') ?: 'false').toString().toBoolean()) ? 'native-nocompiler' : 'native')) // the compiler-free build (-Pgdxvulkan.noCompiler=true) has its own directory

// Plain CMake build (Phase 1a decision: gdx-jnigen deferred until cross-compile support is verified).
// -Pgdxvulkan.noCompiler=true builds the library without the run-time GLSL compiler (glslang): about 0.55 MB instead of 2.5 MB, and no translation of stock GLSL at run time.
// Everything that ships as SPIR-V (the batches, the shape renderer, the model batch, the shader bundle) still works; a custom ShaderProgram reports a clear error.
def noCompiler = (findProperty('gdxvulkan.noCompiler') ?: 'false').toString().toBoolean()
tasks.register('cmakeConfigure', Exec) {
    inputs.file('jni/CMakeLists.txt')
    inputs.property('noCompiler', noCompiler)
    outputs.dir(nativeBuild)
    commandLine 'cmake', '-S', jniDir, '-B', nativeBuild.get().asFile, '-DCMAKE_BUILD_TYPE=Release', "-DGDXVK_GLSLANG=${noCompiler ? 'OFF' : 'ON'}"
}
tasks.register('buildNatives', Exec) {
    dependsOn 'cmakeConfigure'
    inputs.file('jni/CMakeLists.txt') // a changed compiler setting must rebuild the library
    inputs.dir('jni/src')
    inputs.dir('jni/vendor')
    inputs.dir('jni/test')
    outputs.dir(nativeBuild)
    commandLine 'cmake', '--build', nativeBuild.get().asFile, '--config', 'Release', '--parallel'
}
tasks.register('nativeTests', Exec) {
    dependsOn 'buildNatives'
    workingDir nativeBuild
    commandLine 'ctest', '--output-on-failure', '-C', 'Release'
}

// Shaders: src/main/shaders/*.{vert,frag,comp} -> SPIR-V resources at /shaders/<name>.<stage>.spv (see gradle/compile-shaders.gradle).
apply from: "${rootDir}/gradle/compile-shaders.gradle"
def shaderGen = layout.buildDirectory.dir('generated/shaders')
registerCompileShaders(project, file('src/main/shaders'), shaderGen)
sourceSets.main.resources.srcDir(shaderGen)
processResources.dependsOn 'compileShaders'

// The native library built for this machine goes into the jar as /natives/<os>-<arch>/, where GdxVk.loadNatives() looks for it, so a project that
// depends on this one (a composite build or a published jar) needs no -Dgdxvulkan.native.path. One platform per build: build on each OS to bundle it.
def hostOs = System.getProperty('os.name').toLowerCase().contains('win') ? 'windows' : System.getProperty('os.name').toLowerCase().contains('mac') ? 'macos' : 'linux'
def hostArch = System.getProperty('os.arch').toLowerCase().with { it.contains('aarch64') || it.contains('arm64') } ? 'arm64' : 'x86_64'
processResources {
    dependsOn 'buildNatives'
    from(nativeBuild) {
        include 'gdxvk.dll', 'libgdxvk.so', 'libgdxvk.dylib'
        into "natives/${hostOs}-${hostArch}"
    }
}

test {
    useJUnitPlatform()
    dependsOn 'buildNatives'
    systemProperty 'gdxvulkan.native.path', nativeBuild.get().asFile.absolutePath
    systemProperty 'gdxvulkan.validation', System.getProperty('gdxvulkan.validation', 'true')
    systemProperty 'gdxvulkan.forceTierB', System.getProperty('gdxvulkan.forceTierB', 'false')
    systemProperty 'gdxvulkan.requireDriver', System.getProperty('gdxvulkan.requireDriver', 'false')
    System.getProperty('gdxvulkan.device')?.with { v -> systemProperty('gdxvulkan.device', v) }
    // Synchronization validation on every test run (plan, Core decision 8); any message fails the test.
    environment 'VK_LAYER_ENABLES', 'VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT'
    testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
}
check.dependsOn 'nativeTests'
