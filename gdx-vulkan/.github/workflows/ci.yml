name: ci

# Required check (plan, Phase 1a): every test, in Tier A and forceTierB, on lavapipe under Xvfb, with the Khronos validation layer and
# synchronization validation enabled. Goldens are exact lavapipe renders, so the Mesa version is pinned in ci/mesa-version.txt and the
# job fails if the image's Mesa differs. See ci/README.md.
#
# Windows (RTX) and Android runs are manual: GitHub's hosted runners have no GPU.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: 'Regenerate goldens on lavapipe (Mesa pin change) and upload them as an artifact instead of checking'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build CI image
        run: docker build -t gdx-vulkan-ci ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle-ci
          key: gdx-vulkan-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gdx-vulkan-gradle-

      - name: Run checks (Tier A and Tier B) on lavapipe
        run: |
          mkdir -p "$HOME/.gradle-ci" "$RUNNER_TEMP/out"
          docker run --rm \
            -e UPDATE_GOLDENS=${{ inputs.update_goldens && '1' || '0' }} \
            -e SKIP_MESA_PIN=${{ inputs.update_goldens && '1' || '0' }} \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/out:/out" \
            -v "$HOME/.gradle-ci:/root/.gradle" \
            gdx-vulkan-ci bash /src/ci/run-checks.sh

      - name: Upload reports and golden diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdx-vulkan-reports
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

  # Linux arm64 natives (checklist: Core decisions, "natives for Linux arm64"). GitHub's free arm64 runner builds the native library and
  # runs its own tests on lavapipe. The Java suite and the exact goldens stay on x86-64: lavapipe's arithmetic is not promised to be bit-identical
  # across architectures, so they would need their own goldens.
  arm64-natives:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential glslc libvulkan1 mesa-vulkan-drivers \
            vulkan-validationlayers libx11-dev xvfb xauth
          uname -m
          dpkg-query -W -f='mesa-vulkan-drivers ${Version}\n' mesa-vulkan-drivers

      - name: Build the natives
        run: |
          cmake -S gdx-vulkan-core/jni -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel
          file build/native/libgdxvk.so || ls build/native

      - name: Native tests on lavapipe
        run: xvfb-run -a ctest --test-dir build/native --output-on-failure
