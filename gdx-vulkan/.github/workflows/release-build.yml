name: release-build

# A DRAFT, run by hand (workflow_dispatch) and never on a push: it builds the natives of each platform and the Android library and uploads them as workflow artifacts. It does
# NOT publish anything (no tag, no GitHub release, no Maven upload): publishing is decided by the owner (docs/RELEASE.md, TODO.md section 5). It has not been run yet; the Windows job in
# particular (MSVC, the Vulkan SDK for glslc) will probably need a fix on its first run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential glslc libx11-dev
      - name: Build the natives
        run: |
          cmake -S gdx-vulkan-core/jni -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel
      - uses: actions/upload-artifact@v4
        with: { name: natives-linux-x64, path: build/native/libgdxvk.so }

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the Vulkan SDK (glslc)
        uses: jakoch/install-vulkan-sdk-action@v1
        with: { vulkan_version: 1.4.304.1, install_runtime: false, cache: true }
      - name: Build the natives (static MSVC runtime, see jni/CMakeLists.txt)
        run: |
          cmake -S gdx-vulkan-core/jni -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel
      - uses: actions/upload-artifact@v4
        with: { name: natives-windows-x64, path: build/native/**/gdxvk.dll }

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential glslc libx11-dev
      - name: Build the natives
        run: |
          cmake -S gdx-vulkan-core/jni -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel
      - uses: actions/upload-artifact@v4
        with: { name: natives-linux-arm64, path: build/native/libgdxvk.so }

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install glslc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends glslc
      - name: Install the NDK and CMake the library asks for
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build the Android library and the apps
        working-directory: gdx-vulkan-android
        run: |
          chmod +x gradlew
          ./gradlew :library:assembleRelease :testapp:assembleDebug :demoapp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            gdx-vulkan-android/library/build/outputs/aar/*.aar
            gdx-vulkan-android/testapp/build/outputs/apk/debug/*.apk
            gdx-vulkan-android/demoapp/build/outputs/apk/debug/*.apk
