// Desktop glue: native window handles from GLFW (as stock gdx-backend-lwjgl3 uses it) and a clear-screen demo.
// gdx-vulkan renders into the surface itself, so the GLFW windows here are created with GLFW_NO_API.
dependencies {
    api project(':gdx-vulkan-core')
    api "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
    // libGDX's own natives (gdx2d: Pixmap decoding/drawing), which the stock classes under test need.
    api "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"

    // FreeType for the Gate 2 FreeTypeFontGenerator scene (tests only; the library does not depend on it).
    testImplementation "com.badlogicgames.gdx:gdx-freetype:${gdxVersion}"
    testRuntimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-desktop"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def coreNative = project(':gdx-vulkan-core').layout.buildDirectory.dir('native')

// Shared by `test` and `soakTest`.
def configureGpuTest = { Test t ->
    t.useJUnitPlatform()
    t.dependsOn ':gdx-vulkan-core:buildNatives'
    t.systemProperty 'gdxvulkan.native.path', coreNative.get().asFile.absolutePath
    t.systemProperty 'gdxvulkan.validation', System.getProperty('gdxvulkan.validation', 'true')
    t.systemProperty 'gdxvulkan.forceTierB', System.getProperty('gdxvulkan.forceTierB', 'false')
    // libGDX's own test assets (skin, fonts, atlases, particle effects, TTFs) are the content for the Gate 2 scenes.
    t.systemProperty 'gdxvulkan.assetsDir', System.getProperty('gdxvulkan.assetsDir') ?: file('../../tests/gdx-tests-android/assets').absolutePath
    t.systemProperty 'gdxvulkan.requireDriver', System.getProperty('gdxvulkan.requireDriver', 'false')
    // -Dgdxvulkan.device=N picks a physical device by index; the soak and golden output print the device name actually used.
    System.getProperty('gdxvulkan.device')?.with { v -> t.systemProperty('gdxvulkan.device', v) }
    // Golden images (src/test/resources/goldens). Write them with -Dgdxvulkan.updateGoldens=true on lavapipe only.
    t.systemProperty 'gdxvulkan.goldenDir', file('src/test/resources/goldens').absolutePath
    t.systemProperty 'gdxvulkan.diffDir', layout.buildDirectory.dir('golden-diff').get().asFile.absolutePath
    t.systemProperty 'gdxvulkan.updateGoldens', System.getProperty('gdxvulkan.updateGoldens', 'false')
    // Soak test knobs (see SoakTest): -Dgdxvulkan.soakSeconds=600 for the full 10-minute run.
    ['soakSeconds', 'soakBufferRate', 'soakTextureRate', 'soakStrict'].each { k ->
        System.getProperty('gdxvulkan.' + k)?.with { v -> t.systemProperty('gdxvulkan.' + k, v) }
    }
    t.testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
}

test {
    configureGpuTest(it)
    exclude '**/SoakTest*'
    // Synchronization validation on every test run (plan, Core decision 8); any message fails the test.
    environment 'VK_LAYER_ENABLES', 'VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT'
}

// Stress test 1b. Runs 15 s by default; -Dgdxvulkan.soakSeconds=600 for the full run.
// Synchronization validation stays on, except with -Dgdxvulkan.forceTierB=true: that selects fence-based completion tracking, and the
// layer's synchronization validation then slows super-linearly under this load (measured on RTX 5080: 60 fps without it, under 5 fps
// with it, while the same run with the timeline semaphore stays at 60 fps). Core validation still runs. The fence path is covered
// with sync validation by every other test.
tasks.register('soakTest', Test) {
    description = 'Stress/soak test: 50k buffer sub-allocations/s and 2k textures/s at 60 fps.'
    group = 'verification'
    configureGpuTest(it)
    include '**/SoakTest*'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    if (!Boolean.parseBoolean(System.getProperty('gdxvulkan.forceTierB', 'false'))) {
        environment 'VK_LAYER_ENABLES', 'VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT'
    }
}
check.dependsOn 'soakTest'

// The compatibility reference (plan, Core decision 8): stock libGDX SpriteBatch on OpenGL draws the Gate 2 scenes. It needs an OpenGL
// driver and a display, so a failure here is not fatal for the build; the Gate 2 test skips the comparison unless -Dgdxvulkan.requireGl=true.
def glReferenceDir = layout.buildDirectory.dir('gl-reference')
tasks.register('glReferences', JavaExec) {
    description = 'Renders the Gate 2 scenes with stock SpriteBatch on OpenGL into build/gl-reference.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.slebed.gdxvulkan.desktop.GlReferenceMain'
    dependsOn 'testClasses'
    ignoreExitValue = true
    args glReferenceDir.get().asFile.absolutePath, (System.getProperty('gdxvulkan.assetsDir') ?: file('../../tests/gdx-tests-android/assets').absolutePath)
    doFirst { glReferenceDir.get().asFile.deleteDir() }
}
test.dependsOn 'glReferences'
test {
    systemProperty 'gdxvulkan.glReferenceDir', glReferenceDir.get().asFile.absolutePath
    System.getProperty('gdxvulkan.requireGl')?.with { v -> systemProperty('gdxvulkan.requireGl', v) }
}

// Stress test 2: VulkanSpriteBatch against stock SpriteBatch on lwjgl3, same machine. Prints a table against the plan's targets.
// -Dgdxvulkan.device=N picks the GPU for the Vulkan runs; -Dgdxvulkan.stress2.report=true never fails the build.
tasks.register('stress2', JavaExec) {
    description = 'Stress test 2: VulkanSpriteBatch vs stock SpriteBatch (needs an OpenGL driver).'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.slebed.gdxvulkan.desktop.Stress2Main'
    dependsOn 'testClasses', ':gdx-vulkan-core:buildNatives'
    systemProperty 'gdxvulkan.native.path', coreNative.get().asFile.absolutePath
    System.properties.each { k, v -> if (k.toString().startsWith('gdxvulkan.')) systemProperty k.toString(), v.toString() }
}

// Instanced sprite stress test: VulkanSpriteBatchInstanced, 1,000,000 sprites moved by compute (plan target: 60+ fps on the RTX 2080, -Dgdxvulkan.device=1).
// -Dgdxvulkan.stressInstanced.sprites|seconds|size|report=true; fails the build below 60 fps unless report is set.
tasks.register('stressInstanced', JavaExec) {
    description = 'Instanced sprite stress test: 1,000,000 sprites moved by compute and drawn instanced.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.slebed.gdxvulkan.desktop.StressInstancedMain'
    dependsOn 'testClasses', ':gdx-vulkan-core:buildNatives'
    systemProperty 'gdxvulkan.native.path', coreNative.get().asFile.absolutePath
    systemProperty 'gdxvulkan.validation', System.getProperty('gdxvulkan.validation', 'false')
    System.properties.each { k, v -> if (k.toString().startsWith('gdxvulkan.')) systemProperty k.toString(), v.toString() }
}

tasks.register('runTriangleDemo', JavaExec) {
    description = 'Opens a window with a spinning triangle. -Dgdxvulkan.forceTierB=true for Tier B.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.slebed.gdxvulkan.desktop.TriangleDemo'
    dependsOn ':gdx-vulkan-core:buildNatives'
    systemProperty 'gdxvulkan.native.path', coreNative.get().asFile.absolutePath
    systemProperty 'gdxvulkan.validation', System.getProperty('gdxvulkan.validation', 'true')
    systemProperty 'gdxvulkan.forceTierB', System.getProperty('gdxvulkan.forceTierB', 'false')
}

tasks.register('runClearDemo', JavaExec) {
    description = 'Opens a window and cycles the clear colour. -Dgdxvulkan.forceTierB=true for Tier B.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.slebed.gdxvulkan.desktop.ClearScreenDemo'
    dependsOn ':gdx-vulkan-core:buildNatives'
    systemProperty 'gdxvulkan.native.path', coreNative.get().asFile.absolutePath
    systemProperty 'gdxvulkan.validation', System.getProperty('gdxvulkan.validation', 'true')
    systemProperty 'gdxvulkan.forceTierB', System.getProperty('gdxvulkan.forceTierB', 'false')
}
