subprojects {
    apply plugin: 'java-library'
    group = 'io.github.slebed.gdx-vulkan'
    version = findProperty('releaseVersion') ?: '0.1.0-SNAPSHOT' // -PreleaseVersion=0.1.0-beta.1 for a release build (.github/workflows/release.yml)

    repositories {
        mavenCentral()
    }

    // Build with any JDK 11+; emit Java 8 class files like libGDX 1.14 (Android desugaring).
    tasks.withType(JavaCompile).configureEach {
        options.release = 8
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:all'
    }
}
